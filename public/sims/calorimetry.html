<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>量热法模拟实验 — 溶解热 / 中和热 (AP Chemistry Calorimetry)</title>
<meta name="description" content="AP Chemistry 量热法交互模拟：咖啡杯热量计测定溶解热与中和热，含操作误差分析与外推法拓展。">
<meta name="theme-color" content="#eef1f6">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23eef1f6'/%3E%3Cpath d='M11 9 h10 l-2 15 h-6 z' fill='none' stroke='%231f6fb8' stroke-width='2'/%3E%3Cpath d='M12.07 17 h7.86 l-0.93 7 h-6 z' fill='%23d9532f'/%3E%3C/svg%3E">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
    background: #eef1f6;
    color: #1e2b3a;
    padding: 18px;
    min-width: 1200px;
  }
  h1 { font-size: 20px; font-weight: 600; margin-bottom: 4px; color: #0d5f9e; }
  .subtitle { font-size: 12px; color: #6b7f94; }
  .hdr { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 14px; }
  .langSw { display: flex; flex-shrink: 0; border: 1px solid #c3cedb; border-radius: 7px; overflow: hidden; }
  .langSw button {
    background: #fff; color: #5d7085; border: none; border-radius: 0;
    padding: 6px 15px; font-size: 13px; cursor: pointer;
  }
  .langSw button:hover { background: #eef2f7; }
  .langSw button.active { background: #1f6fb8; color: #fff; font-weight: 600; }
  .layout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; }
  .col { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
  /* 两列等高，末块面板撑满剩余高度——否则实验跑完前右列会留一个空洞 */
  .col > .panel:last-child { flex: 1 1 auto; }
  .full { margin-top: 14px; }
  .panel {
    background: #ffffff;
    border: 1px solid #dde3ec;
    border-radius: 10px;
    padding: 12px;
  }
  .panel h2 { font-size: 14px; color: #16679f; margin-bottom: 10px; font-weight: 600; }
  canvas { display: block; border-radius: 6px; }
  #lab { background: linear-gradient(#f4f8fc, #e9eff7); width: 100%; max-width: 780px; }
  #graph { background: #fbfcfe; width: 100%; }
  /* 上限同时约束宽和高：小图高度是按宽度 0.62 倍算的，不封顶会在宽屏上撑成巨图 */
  .errGraph { background: #fbfcfe; width: 100%; max-width: 540px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 10px; }
  label { font-size: 14px; color: #3d5270; }
  select, input[type=number] {
    background: #ffffff; color: #1e2b3a; border: 1px solid #c3cedb;
    border-radius: 6px; padding: 6px 9px; font-size: 14px; width: 96px;
  }
  select { width: auto; }
  button {
    background: #1f6fb8; color: #fff; border: none; border-radius: 6px;
    padding: 8px 17px; font-size: 14px; cursor: pointer; transition: background .15s;
  }
  button:hover { background: #1667ab; }
  button:disabled { background: #c6d0dc; color: #7d8b9c; cursor: not-allowed; }
  button.ghost { background: #e7ecf3; color: #2c3e52; }
  button.ghost:hover { background: #d8e0ea; }
  button.speed { background: #e7ecf3; color: #2c3e52; padding: 5px 10px; }
  button.speed:hover { background: #d8e0ea; }
  button.speed.active { background: #1f6fb8; color: #fff; }
  .readout {
    display: flex; gap: 18px; margin-top: 10px; font-size: 13px;
  }
  .readout .box {
    background: #f7fafd; border: 1px solid #e0e6ee; border-radius: 8px;
    padding: 8px 14px; text-align: center; min-width: 110px;
  }
  .readout .box .val { font-size: 22px; font-weight: 700; font-family: Consolas, monospace; }
  .readout .box .cap { font-size: 12px; color: #6b7f94; margin-top: 2px; }
  #tempVal.hot { color: #d9532f; } #tempVal.cold { color: #1f7fc4; } #tempVal.neutral { color: #2e7d32; }
  #status { font-size: 13px; color: #a8730a; min-height: 18px; margin-top: 8px; }
  /* ---- 误差分析 ---- */
  .flawRow { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
  .flaw {
    background: #eef2f7; color: #3d5270; border: 1px solid #d8dfe8;
    border-radius: 16px; padding: 5px 14px; font-size: 13px; cursor: pointer;
    transition: background .15s, border-color .15s, color .15s;
  }
  .flaw:hover { background: #e2e9f2; }
  .flaw.active { background: #1f6fb8; border-color: #1f6fb8; color: #fff; font-weight: 600; }
  .errLegend { display: flex; gap: 20px; flex-wrap: wrap; align-items: center; font-size: 12.5px; color: #5d7085; margin-bottom: 10px; }
  .errLegend span { display: flex; align-items: center; gap: 7px; }
  .errLegend .ln { display: inline-block; width: 24px; height: 0; border-top: 2px solid; }
  .errLegend .ln.dashed { border-top-style: dashed; border-color: #7b8ea3; }
  .errLegend .ln.ctrl { border-color: #54637a; }
  .errLegend .ln.act { border-color: #d9532f; border-top-width: 3px; }
  .errLegend .sw { display: inline-block; width: 17px; height: 12px; border-radius: 2px; }
  .errLegend .sw.light { background: linear-gradient(rgba(217,83,47,0.14), rgba(217,83,47,0.14)), #fbfcfe; }
  .errLegend .sw.dark { background: linear-gradient(rgba(217,83,47,0.42), rgba(217,83,47,0.42)), #fbfcfe; }
  .errGrid { display: grid; grid-template-columns: minmax(0,560px) minmax(0,560px) minmax(300px,1fr); gap: 12px; align-items: start; }
  .errCard { background: #f7fafd; border: 1px solid #e0e6ee; border-radius: 8px; padding: 10px; }
  .errCard h3 { font-size: 13px; font-weight: 600; margin-bottom: 8px; color: #2b3d52; }
  .errCard h3 .tag { font-size: 11px; font-weight: 400; color: #6b7f94; margin-left: 6px; }
  .verdict { font-size: 13px; line-height: 1.75; }
  .verdict .line { padding: 4px 0; border-bottom: 1px dashed #e4eaf1; }
  .verdict .line:last-of-type { border-bottom: none; }
  .verdict .kExo { color: #c0392b; font-weight: 600; }
  .verdict .kEndo { color: #1f7fc4; font-weight: 600; }
  .verdict .pct { font-family: Consolas, monospace; font-weight: 700; }
  .verdict .rule {
    margin-top: 8px; padding: 9px 11px; background: #e8f2fb; border-left: 3px solid #2b8fd6;
    border-radius: 6px; color: #1c3d5a; font-size: 12.5px; line-height: 1.7;
  }
  .verdict .mech { font-size: 12px; color: #6b7f94; margin-bottom: 8px; }
  /* ---- 外推法拓展（从属） ---- */
  details.extrap { margin-top: 10px; border-top: 1px solid #e4eaf1; padding-top: 8px; }
  details.extrap > summary {
    font-size: 12px; color: #6b7f94; cursor: pointer; list-style: none; user-select: none;
  }
  details.extrap > summary::-webkit-details-marker { display: none; }
  details.extrap > summary::before { content: "▸ "; }
  details.extrap[open] > summary::before { content: "▾ "; }
  details.extrap > summary:hover { color: #16679f; }
  details.extrap .body { font-size: 12px; color: #5d7085; line-height: 1.7; margin-top: 8px; }
  details.extrap table { border-collapse: collapse; margin-top: 6px; font-size: 12px; font-family: Consolas, monospace; }
  details.extrap td { border: 1px solid #dde3ec; padding: 2px 8px; text-align: right; }
  .chk { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #5d7085; cursor: pointer; }
  .chk input { accent-color: #1f6fb8; cursor: pointer; }
  .h2row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
  .h2row h2 { margin-bottom: 0; }
  #results { font-size: 14px; line-height: 1.75; }
  #results .formula { font-family: Consolas, monospace; background: #eef3f8; padding: 2px 6px; border-radius: 4px; color: #2c6e49; }
  #results table { border-collapse: collapse; margin-top: 8px; font-size: 12px; font-family: Consolas, monospace; }
  #results td, #results th { border: 1px solid #dde3ec; padding: 2px 8px; text-align: right; }
  #results th { color: #16679f; }
  #results .err-good { color: #2e7d32; } #results .err-warn { color: #a8730a; } #results .err-bad { color: #c0392b; }
  .hint { font-size: 13px; color: #5d7085; margin-top: 8px; line-height: 1.65; }
  .fieldgroup { display: flex; gap: 16px; flex-wrap: wrap; }
  .fieldgroup label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; }
</style>
</head>
<body>
<div class="hdr">
  <div>
    <h1 data-i18n="h1">Calorimetry Simulation</h1>
    <div class="subtitle" data-i18n-html="subtitle"></div>
  </div>
  <div class="langSw" id="langSw">
    <button data-lang="en">English</button>
    <button data-lang="zh">中文</button>
  </div>
</div>

<div class="layout">
  <div class="col">
    <div class="panel">
      <h2 data-i18n="panel.lab">Apparatus</h2>
      <canvas id="lab"></canvas>
      <div class="readout">
        <div class="box"><div class="val neutral" id="tempVal">--.-</div><div class="cap" data-i18n="cap.temp"></div></div>
        <div class="box"><div class="val" id="timeVal" style="color:#1e2b3a">0</div><div class="cap" data-i18n="cap.time"></div></div>
        <div class="box"><div class="val" id="dtVal" style="color:#1e2b3a">--</div><div class="cap" data-i18n="cap.dt"></div></div>
      </div>
      <div id="status"></div>
    </div>

    <div class="panel">
      <h2 data-i18n="panel.setup">Experiment Setup</h2>
      <div class="row">
        <label><span data-i18n="label.expt"></span>
          <select id="exptSelect"></select>
        </label>
      </div>
      <div class="row fieldgroup" id="inputFields"></div>
      <div class="row">
        <button id="startBtn" data-i18n="btn.start"></button>
        <button id="resetBtn" class="ghost" data-i18n="btn.reset"></button>
        <span style="font-size:13px;color:#5d7085" data-i18n="label.speed"></span>
        <button class="speed" data-sp="1">1×</button>
        <button class="speed active" data-sp="4">4×</button>
        <button class="speed" data-sp="10">10×</button>
      </div>
      <div class="hint" id="theoryHint"></div>
      <div class="hint" data-i18n-html="principle.full"></div>
    </div>
  </div>

  <div class="col">
    <div class="panel">
      <div class="h2row">
        <h2 data-i18n="panel.graph">Temperature – Time Curve</h2>
        <label class="chk"><input type="checkbox" id="showIdeal"><span data-i18n="graph.showIdeal"></span></label>
      </div>
      <canvas id="graph"></canvas>
      <div class="hint" id="graphLegend" style="display:none"></div>
      <details class="extrap">
        <summary data-i18n="extrap.summary"></summary>
        <div class="body">
          <div data-i18n="extrap.body"></div>
          <div class="row" style="margin-top:8px">
            <button id="extrapBtn" class="ghost" disabled data-i18n="btn.extrap"></button>
            <label class="chk"><input type="checkbox" id="showExtrap" disabled><span data-i18n="extrap.show"></span></label>
          </div>
          <div id="extrapOut"></div>
          <div style="margin-top:6px" data-i18n-html="extrap.caveat"></div>
        </div>
      </details>
    </div>

    <div class="panel">
      <h2 data-i18n="panel.results">Data Processing &amp; Results</h2>
      <div id="results"></div>
    </div>
  </div>
</div>

<div class="panel full">
  <h2 data-i18n="panel.err">Error Analysis</h2>
  <div class="flawRow" id="flawRow"></div>
  <div class="errLegend">
    <span><i class="ln dashed"></i><span data-i18n="err.legend.ideal"></span></span>
    <span><i class="ln ctrl"></i><span data-i18n="err.legend.ctrl"></span></span>
    <span><i class="ln act"></i><span data-i18n="err.legend.act"></span></span>
    <span><i class="sw light"></i><span data-i18n="err.legend.light"></span></span>
    <span><i class="sw dark"></i><span data-i18n="err.legend.dark"></span></span>
  </div>
  <div class="errGrid">
    <div class="errCard">
      <h3><span data-i18n="err.card.exo"></span> <span class="tag" data-i18n="err.card.exoTag"></span></h3>
      <canvas class="errGraph" id="errExo"></canvas>
    </div>
    <div class="errCard">
      <h3><span data-i18n="err.card.endo"></span> <span class="tag" data-i18n="err.card.endoTag"></span></h3>
      <canvas class="errGraph" id="errEndo"></canvas>
    </div>
    <div class="verdict" id="errVerdict"></div>
  </div>
</div>

// 语言优先级：URL 的 ?lang= > 上次选择 > 默认英文
let LANG = (() => {
  const q = new URLSearchParams(location.search).get("lang");
  if (q && I18N[q]) return q;
  try { const saved = localStorage.getItem("calorimetry-lang"); if (saved && I18N[saved]) return saved; } catch (e) {}
  return "en";
})();

function t(key, params) {
  const s = (I18N[LANG] && I18N[LANG][key]) ?? I18N.en[key] ?? key;
  if (!params) return s;
  return s.replace(/\{(\w+)\}/g, (m, k) => (params[k] !== undefined ? params[k] : m));
}

const C_WATER = 4.18;      // J·g⁻¹·°C⁻¹
const RUN_TIME = 150;      // 模拟时长（秒）

/* ================= 逻辑坐标系与温度模型 ================= */
// 绘图代码全部沿用旧的 456×430 坐标，由 drawLab() 里的平移+缩放映射到新画布。
// 画布逻辑宽度刻意压得较窄（场景两侧只留少量注释空间），这样在半屏宽的主栏里
// 缩放系数更大、装置本身也画得更大。
const LAB_W = 640, LAB_H = 510;      // 新逻辑画布尺寸
const TABLE_Y = 460;                 // 桌面在逻辑坐标中的 y
const SCENE_OX = 320, SCENE_Z = 1.28;// 场景中心 x 与放大倍数
const PIVOT = { x: 228, y: 392 };    // 旧坐标中「杯底中心」，缩放不动点

// 纯函数温度模型，主图与误差分析小图共用。tau2 = Infinity 即完全绝热。
function curveT(t, T0, dTeq, tau1, tau2) {
  return T0 + dTeq * (1 - Math.exp(-t / tau1)) * Math.exp(-t / tau2);
}
// 峰值：放热取最大、吸热取最小
function peakOf(fn, dir) {
  let best = null;
  for (let t = 0; t <= RUN_TIME; t += 0.1) {
    const v = fn(t);
    if (best === null || (v - best) * dir > 0) best = v;
  }
  return best;
}

/* ================= 操作缺陷 ================= */
// tau2f 越小 = 与环境热交换越快；tau1f 越大 = 升温越滞后。
// tau2f 由标定得出，使「相对标准装置的额外代价」依次约为 8% / 13% / 17% / 21%。
const FLAWS = {
  none:   { nameKey: "flaw.none",   mechKey: "flaw.none.mech",   tau2f: 1.00, tau1f: 1.0 },
  nolid:  { nameKey: "flaw.nolid",  mechKey: "flaw.nolid.mech",  tau2f: 0.44, tau1f: 1.0 },
  probe:  { nameKey: "flaw.probe",  mechKey: "flaw.probe.mech",  tau2f: 0.31, tau1f: 1.0 },
  nostir: { nameKey: "flaw.nostir", mechKey: "flaw.nostir.mech", tau2f: 0.38, tau1f: 1.6 },
  glass:  { nameKey: "flaw.glass",  mechKey: "flaw.glass.mech",  tau2f: 0.19, tau1f: 1.0 },
};
const FLAW_ORDER = ["nolid", "nostir", "probe", "glass"];
const ERR_TAU1 = 12, ERR_TAU2 = 650, ERR_CCAL = 8;

// 误差分析用的两个代表性反应，参数与主模拟保持同一套算法
function demoReaction(key, mass, water) {
  const e = EXPERIMENTS[key];
  const n = mass / e.mm;
  const mSol = water + mass;
  const Q = n * Math.abs(e.dH) * 1000;
  return {
    T0: 22, tau1: ERR_TAU1, tau2: ERR_TAU2,
    dTeq: (e.dH < 0 ? 1 : -1) * Q / (mSol * C_WATER + ERR_CCAL),
  };
}
const ERR_DEMO = {
  exo:  demoReaction("naoh", 5.0, 100),
  endo: demoReaction("nh4no3", 8.0, 100),
};

function readInputs() {
  const v = id => parseFloat(document.getElementById(id).value);
  const e = S.expt, inp = {};
  if (e.type === "dissolve") {
    inp.mass = Math.min(Math.max(v("in_mass") || e.defaultMass, 0.5), e.maxMass);
    inp.water = Math.min(Math.max(v("in_water") || 100, 50), 200);
  } else {
    inp.va = v("in_va") || 50; inp.ca = v("in_ca") || 1;
    inp.vb = v("in_vb") || 50; inp.cb = v("in_cb") || 1;
  }
  inp.t0 = Math.min(Math.max(v("in_t0") || 22, 15), 30);
  return inp;
}

/* ================= 模拟核心 ================= */
function modelT(t) {  // 无噪声理论温度：快速趋近平衡 + 缓慢散热回室温
  return S.T0 + S.dTeq * (1 - Math.exp(-t / S.tau1)) * Math.exp(-t / S.tau2);
}
const noise = () => (Math.random() + Math.random() - 1) * 0.07;  // ≈±0.07 °C

function startExperiment() {
  const e = S.expt, inp = readInputs();
  S.inputs = inp; S.T0 = inp.t0;

  if (e.type === "dissolve") {
    S.n = inp.mass / e.mm;
    S.mSol = inp.water * 1.00 + inp.mass;   // 密度≈1 g/mL
  } else {
    const nH = inp.va * inp.ca / 1000, nOH = inp.vb * inp.cb / 1000;
    S.n = Math.min(nH, nOH);
    S.mSol = (inp.va + inp.vb) * 1.00;
    S.inputs.limiting = nH <= nOH ? "HCl" : "NaOH";
  }
  // 真实热量：带 ±1.5% 随机误差；热量计自身也吸热（学生若忽略会产生系统误差）
  S.Q = S.n * Math.abs(e.dH) * 1000 * (1 + (Math.random() * 0.03 - 0.015));
  S.cCal = 7 + Math.random() * 2;                       // 热量计热容 J/°C（隐藏，近似恒定，
                                                        // 否则它会盖过操作缺陷造成的差异）
  S.dTeq = (e.dH < 0 ? 1 : -1) * S.Q / (S.mSol * C_WATER + S.cCal);
  // 标准装置（双层泡沫杯 + 杯盖 + 搅拌）的基准时间常数，再按操作缺陷放大换热
  const fl = FLAWS[S.flaw];
  // 基准 τ₂ 的随机范围刻意取得较窄（±7%）：操作缺陷造成的差异远大于随机波动，
  // 这样学生换一个操作条件重跑，看到的差别确实来自那个操作，而不是碰巧的运气。
  S.tau1 = (10 + Math.random() * 5) * fl.tau1f;
  S.tau2 = (600 + Math.random() * 100) * fl.tau2f;

  S.phase = "pour1"; S.phaseT = 0; S.simT = 0; S.level = 0;
  S.data = []; S.particles = []; S.lastSample = -1;
  resetExtrapUI(false);
  startBtn.disabled = true;
  S.result = null; renderResults();
  setStatus(e.type === "dissolve" ? "status.pourWater" : "status.pourHCl");
}

function resetSim() {
  S.phase = "idle"; S.phaseT = 0; S.simT = 0; S.level = 0;
  S.data = []; S.particles = [];
  resetExtrapUI(false);
  startBtn.disabled = false;
  setStatus("status.idle");
  tempVal.textContent = "--.-"; tempVal.className = "val neutral";
  timeVal.textContent = "0"; dtVal.textContent = "--";
  S.result = null; renderResults();
}

startBtn.addEventListener("click", startExperiment);
resetBtn.addEventListener("click", resetSim);

/* ================= 相位推进 ================= */
function tick(dtReal) {
  if (S.phase === "idle" || S.phase === "done") return;
  S.phaseT += dtReal;
  const e = S.expt;

  if (S.phase === "pour1") {
    S.level = Math.min(S.phaseT / 2.2, 1) * (e.type === "neutralize" ? 0.5 : 1);
    if (S.phaseT >= 2.2) { S.phase = e.type === "neutralize" ? "pour2" : "add"; S.phaseT = 0;
      setStatus(e.type === "neutralize" ? "status.pourNaOH" : "status.adding", { solute: e.solute }); }
  } else if (S.phase === "pour2") {
    S.level = 0.5 + Math.min(S.phaseT / 2.2, 1) * 0.5;
    if (S.phaseT >= 2.2) { S.phase = "run"; S.phaseT = 0; setStatus("status.reacting"); }
  } else if (S.phase === "add") {
    if (S.phaseT < 1.6 && Math.random() < 0.5) spawnSolute();
    if (S.phaseT >= 2.0) { S.phase = "run"; S.phaseT = 0; setStatus("status.dissolving"); }
  } else if (S.phase === "run") {
    S.simT += dtReal * S.speed;
    if (S.simT - S.lastSample >= 1) {          // 每 1 模拟秒采样
      S.lastSample = S.simT;
      S.data.push({ t: S.simT, T: modelT(S.simT) + noise() });
    }
    updateParticles(dtReal);
    if (S.simT >= RUN_TIME) finishExperiment();
  }
  // 溶解中的固体颗粒动画
  if (S.phase === "run" && e.type === "dissolve" && S.simT < 25 && Math.random() < 0.12) spawnSolute(true);
}

function spawnSolute(inLiquid) {
  const e = S.expt;
  S.particles.push({
    x: 195 + Math.random() * 70,
    y: inLiquid ? liquidTopY() + Math.random() * 20 : 120,
    vy: inLiquid ? 8 + Math.random() * 8 : 90 + Math.random() * 40,
    r: 2 + Math.random() * 2.5, life: 1, color: e.solid || "#fff",
  });
}
function updateParticles(dt) {
  const floor = liquidBottomY() - 4;
  for (const p of S.particles) {
    p.y += p.vy * dt;
    if (p.y > floor) { p.y = floor; p.vy = 0; p.life -= dt * 0.55; }
    else if (p.y > liquidTopY()) { p.vy = Math.min(p.vy, 25); p.life -= dt * 0.28; }
  }
  S.particles = S.particles.filter(p => p.life > 0);
}

/* ================= 装置绘制 ================= */
const CUP = { x1: 128, x2: 328, top: 150, bot: 372, inset: 14 };
function widthAt(y) {  // 杯体梯形内宽插值
  const f = (y - CUP.top) / (CUP.bot - CUP.top);
  return { l: CUP.x1 + CUP.inset + f * 10, r: CUP.x2 - CUP.inset - f * 10 };
}
function liquidTopY() { return CUP.bot - 8 - S.level * (CUP.bot - CUP.top - 34); }
function liquidBottomY() { return CUP.bot - 8; }

// 按设备像素比设置画布后端尺寸，并返回逻辑坐标 → 设备像素的缩放系数
function fitCanvas(cv, logicalW, logicalH) {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const cssW = Math.max(1, cv.clientWidth);
  const cssH = Math.max(1, Math.round(cssW * logicalH / logicalW));
  if (cv.style.height !== cssH + "px") cv.style.height = cssH + "px";
  const bw = Math.round(cssW * dpr), bh = Math.round(cssH * dpr);
  if (cv.width !== bw) cv.width = bw;
  if (cv.height !== bh) cv.height = bh;
  return { sx: bw / logicalW, sy: bh / logicalH };
}

function drawLab(now) {
  const c = lctx, e = S.expt;
  const sc = fitCanvas(lab, LAB_W, LAB_H);
  c.setTransform(sc.sx, 0, 0, sc.sy, 0, 0);
  c.clearRect(0, 0, LAB_W, LAB_H);

  // 桌面
  c.fillStyle = "#cdbfa6"; c.fillRect(0, TABLE_Y, LAB_W, 38);
  c.fillStyle = "#e9eff7"; c.fillRect(0, TABLE_Y + 38, LAB_W, LAB_H - TABLE_Y - 38);

  // 以下全部沿用旧的 456×430 坐标系，靠这一层变换映射到新画布
  c.save();
  c.translate(SCENE_OX, TABLE_Y);
  c.scale(SCENE_Z, SCENE_Z);
  c.translate(-PIVOT.x, -PIVOT.y);

  // 外杯（换成玻璃烧杯时改为半透明）
  const glass = S.flaw === "glass";
  c.fillStyle = glass ? "rgba(120,170,215,0.20)" : "#f0e9d6";
  c.beginPath();
  c.moveTo(CUP.x1, CUP.top); c.lineTo(CUP.x2, CUP.top);
  c.lineTo(CUP.x2 - 22, CUP.bot); c.lineTo(CUP.x1 + 22, CUP.bot);
  c.closePath(); c.fill();
  c.strokeStyle = glass ? "#16679f" : "#b0a88f"; c.lineWidth = glass ? 2.5 : 2; c.stroke();
  // 内杯
  c.fillStyle = glass ? "rgba(120,170,215,0.14)" : "#faf7ec";
  c.beginPath();
  c.moveTo(CUP.x1 + CUP.inset, CUP.top + 8); c.lineTo(CUP.x2 - CUP.inset, CUP.top + 8);
  c.lineTo(CUP.x2 - CUP.inset - 12, CUP.bot - 8); c.lineTo(CUP.x1 + CUP.inset + 12, CUP.bot - 8);
  c.closePath(); c.fill();

  // 液体
  if (S.level > 0.01) {
    const ty = liquidTopY(), by = liquidBottomY();
    const wt = widthAt(ty), wb = widthAt(by);
    c.fillStyle = e.color;
    c.beginPath();
    c.moveTo(wt.l, ty); c.lineTo(wt.r, ty); c.lineTo(wb.r, by); c.lineTo(wb.l, by);
    c.closePath(); c.fill();
    // 液面高光
    c.fillStyle = "rgba(255,255,255,0.25)";
    c.fillRect(wt.l, ty, wt.r - wt.l, 2.5);
  }

  // 溶质颗粒（浅色背景下白色固体要描边才看得见）
  for (const p of S.particles) {
    c.globalAlpha = Math.max(p.life, 0);
    c.fillStyle = p.color;
    c.strokeStyle = "rgba(88,104,122,0.6)"; c.lineWidth = 0.9;
    c.beginPath(); c.arc(p.x, p.y, p.r, 0, Math.PI * 2); c.fill(); c.stroke();
  }
  c.globalAlpha = 1;

  // 杯盖（带两个孔）；选择「不盖盖子」则不画
  if (S.flaw !== "nolid") {
    c.fillStyle = "#e6dfc8";
    c.fillRect(CUP.x1 - 10, CUP.top - 14, CUP.x2 - CUP.x1 + 20, 16);
    c.fillStyle = "#cdd6e2";
    c.fillRect(198, CUP.top - 15, 18, 18);   // 温度计孔
    c.fillRect(268, CUP.top - 15, 14, 18);   // 搅拌器孔
  }

  drawThermometer(c);
  drawStirrer(c, now);

  // 倾倒动画
  if (S.phase === "pour1" || S.phase === "pour2") drawPouring(c);
  if (S.phase === "add") drawSpatula(c);

  // 标签
  c.fillStyle = "#5d7085"; c.font = "11px sans-serif";
  c.fillText(t(glass ? "cv.glassbeaker" : "cv.foamcup"), CUP.x1 - 4, CUP.bot + 22);
  c.fillText(t("cv.thermometer"), 150, 46);
  c.fillText(t("cv.stirrer"), 256, 46);
  if (S.flaw === "nolid") {
    c.fillStyle = "#c0392b";
    c.fillText(t("cv.nolid"), CUP.x2 - 46, CUP.top + 6);
  }

  c.restore();
  drawHeatFlow(c);
}

function roundRectPath(c, x, y, w, h, r) {
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r);
  c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r);
  c.arcTo(x, y, x + w, y, r);
  c.closePath();
}
// 中文逐字断行，西文按词断行——否则英文会被从单词中间劈开（"surro / undings"）
const CJK = /[⺀-〿぀-鿿豈-﫿︰-﹏＀-￯]/;
function tokenize(text) {
  const out = []; let buf = "";
  for (const ch of text) {
    if (CJK.test(ch)) { if (buf) { out.push(buf); buf = ""; } out.push(ch); }
    else if (ch === " ") { if (buf) { out.push(buf); buf = ""; } out.push(" "); }
    else buf += ch;
  }
  if (buf) out.push(buf);
  return out;
}
function wrapLines(c, text, maxW) {
  const out = []; let line = "";
  for (const tk of tokenize(text)) {
    if (line && c.measureText((line + tk).trimEnd()).width > maxW) {
      out.push(line.trimEnd()); line = tk === " " ? "" : tk;
    } else line += tk;
  }
  if (line.trim()) out.push(line.trimEnd());
  return out;
}
function wrapText(c, text, x, y, maxW, lh) {
  let yy = y;
  for (const ln of wrapLines(c, text, maxW)) { c.fillText(ln, x, yy); yy += lh; }
  return yy - lh;
}
function flowArrow(c, x, y, dx, dy, color) {
  const len = Math.hypot(dx, dy), ux = dx / len, uy = dy / len;
  c.strokeStyle = color; c.lineWidth = 3; c.lineCap = "round";
  c.beginPath(); c.moveTo(x, y); c.lineTo(x + dx - ux * 10, y + dy - uy * 10); c.stroke();
  c.fillStyle = color;
  c.beginPath();
  c.moveTo(x + dx, y + dy);
  c.lineTo(x + dx - ux * 12 + uy * 6, y + dy - uy * 12 - ux * 6);
  c.lineTo(x + dx - ux * 12 - uy * 6, y + dy - uy * 12 + ux * 6);
  c.closePath(); c.fill();
}

// 当前操作缺陷的热流示意（逻辑坐标，位于场景变换之外）
function drawHeatFlow(c) {
  if (S.flaw === "none") return;
  const fl = FLAWS[S.flaw];
  const exo = S.expt.dH < 0;                      // 反应本身放热/吸热，与是否已开始无关
  const col = exo ? "#d9532f" : "#1f7fc4";
  const cx = SCENE_OX;
  const cupTop = TABLE_Y - (PIVOT.y - CUP.top) * SCENE_Z;
  const halfW = (CUP.x2 - CUP.x1) / 2 * SCENE_Z;
  const y0 = cupTop + 74;
  const L0 = cx - halfW - 12, L1 = cx - halfW - 68;
  const R0 = cx + halfW + 12, R1 = cx + halfW + 68;
  if (exo) {                                       // 放热：热量外流
    flowArrow(c, L0, y0, L1 - L0, 0, col);
    flowArrow(c, R0, y0, R1 - R0, 0, col);
  } else {                                         // 吸热：环境热量补入
    flowArrow(c, L1, y0, L0 - L1, 0, col);
    flowArrow(c, R1, y0, R0 - R1, 0, col);
  }

  // 右下角说明卡：先按最长一行算宽、再按折行数算高，中英文都能自适应
  const pad = 12, gap = 7;
  const blocks = [
    { text: t(exo ? "cv.heatout" : "cv.heatin"), font: "bold 13px sans-serif", color: col, lh: 17 },
    { text: t("cv.op") + t(fl.nameKey), font: "12px sans-serif", color: "#2b3d52", lh: 16 },
    { text: t(fl.mechKey), font: "11px sans-serif", color: "#5d7085", lh: 15 },
    { text: t(exo ? "cv.arrowExo" : "cv.arrowEndo"), font: "bold 12px sans-serif", color: col, lh: 17 },
  ];
  let needW = 0, needH = 0;
  for (const b of blocks) {
    c.font = b.font;
    const one = c.measureText(b.text).width;
    needW = Math.max(needW, one);
    b.lines = wrapLines(c, b.text, 168);          // 先按上限宽度折行
    needH += b.lines.length * b.lh + gap;
  }
  const bw = Math.min(needW + pad * 2, 186);
  for (const b of blocks) { c.font = b.font; b.lines = wrapLines(c, b.text, bw - pad * 2); }
  let bh = -gap;
  for (const b of blocks) bh += b.lines.length * b.lh + gap;
  bh += pad * 2;

  const bx = LAB_W - 16 - bw, by = TABLE_Y - 14 - bh;
  c.fillStyle = "rgba(255,255,255,0.96)";
  roundRectPath(c, bx, by, bw, bh, 8); c.fill();
  c.strokeStyle = col; c.lineWidth = 1.5;
  roundRectPath(c, bx, by, bw, bh, 8); c.stroke();
  let ty = by + pad;
  for (const b of blocks) {
    c.font = b.font; c.fillStyle = b.color;
    for (const ln of b.lines) { ty += b.lh; c.fillText(ln, bx + pad, ty - 4); }
    ty += gap;
  }
}

function drawThermometer(c) {
  const x = 207, top = 56;
  const bottom = S.flaw === "probe" ? 356 : 330;   // 接触杯底时插得更深
  const T = currentDisplayT();
  const frac = Math.min(Math.max((T - 0) / 60, 0), 1);   // 0–60 °C 量程
  // 玻璃管
  c.fillStyle = "rgba(255,255,255,0.75)";
  c.fillRect(x - 5, top, 10, bottom - top);
  c.strokeStyle = "#54637a"; c.lineWidth = 1.5;
  c.strokeRect(x - 5, top, 10, bottom - top);
  // 液泡
  c.beginPath(); c.arc(x, bottom, 11, 0, Math.PI * 2);
  c.fillStyle = "#b02a2a"; c.fill(); c.stroke();
  // 红色液柱
  const colTop = bottom - frac * (bottom - top - 6);
  c.fillStyle = "#d93a3a";
  c.fillRect(x - 2.5, colTop, 5, bottom - colTop);
  // 刻度
  c.fillStyle = "#5d7085"; c.font = "9px sans-serif";
  for (let t = 0; t <= 60; t += 10) {
    const y = bottom - (t / 60) * (bottom - top - 6);
    c.fillRect(x + 6, y, 4, 1);
    c.fillText(t + "", x + 13, y + 3);
  }
}

function drawStirrer(c, now) {
  const running = S.phase === "run" && S.flaw !== "nostir";
  const ang = running ? Math.sin(now / 90) * 0.09 : 0;
  c.save();
  c.translate(275, 60);
  c.rotate(ang);
  c.strokeStyle = "#8fa3b8"; c.lineWidth = 5; c.lineCap = "round";
  c.beginPath(); c.moveTo(0, 0); c.lineTo(0, 278); c.stroke();
  c.lineWidth = 3.5;
  c.beginPath(); c.ellipse(0, 284, 13, 6, 0, 0, Math.PI * 2); c.stroke();
  c.restore();
  // 顶部手柄
  c.fillStyle = "#6b7f94"; c.fillRect(263, 48, 24, 14);
}

function drawPouring(c) {
  const prog = Math.min(S.phaseT / 2.2, 1);
  const bx = 60, by = 60, tilt = -0.7;
  c.save();
  c.translate(bx + 45, by + 30); c.rotate(tilt);
  c.fillStyle = "rgba(150,185,220,0.28)"; c.strokeStyle = "#54637a"; c.lineWidth = 2;
  c.beginPath(); c.rect(-28, -34, 56, 68); c.fill(); c.stroke();
  c.fillStyle = S.expt.color;
  const h = 60 * (1 - prog * 0.8);
  c.fillRect(-26, 32 - h, 52, h);
  c.restore();
  // 液流
  if (prog < 0.95) {
    c.strokeStyle = S.expt.color.replace("0.55", "0.9");
    c.lineWidth = 5; c.lineCap = "round";
    c.beginPath(); c.moveTo(140, 78); c.lineTo(228, liquidTopY() + 4); c.stroke();
  }
  c.fillStyle = "#5d7085"; c.font = "11px sans-serif";
  c.fillText(S.phase === "pour1"
    ? t(S.expt.type === "dissolve" ? "cv.pourWater" : "cv.pourHCl")
    : t("cv.pourNaOH"), 40, 40);
}

function drawSpatula(c) {
  const prog = Math.min(S.phaseT / 2.0, 1);
  const x = 200 + prog * 30, y = 95 + prog * 12;
  c.strokeStyle = "#8b9aab"; c.lineWidth = 4; c.lineCap = "round";
  c.beginPath(); c.moveTo(x - 70, y - 24); c.lineTo(x, y); c.stroke();
  c.fillStyle = S.expt.solid;
  c.beginPath(); c.ellipse(x + 6, y - 3, 15, 6, 0, 0, Math.PI * 2); c.fill();
  c.fillStyle = "#5d7085"; c.font = "11px sans-serif";
  c.fillText(S.expt.solute + t("cv.solid"), x - 66, y - 34);
}

/* ================= 实时读数 ================= */
function currentDisplayT() {
  if (S.phase === "run" || S.phase === "done") return modelT(S.simT) + noise() * 0.4;
  return S.T0;
}
function updateReadout() {
  const T = currentDisplayT();
  tempVal.textContent = T.toFixed(1);
  tempVal.className = "val " + (S.dTeq > 0.05 ? "hot" : S.dTeq < -0.05 ? "cold" : "neutral");
  timeVal.textContent = Math.floor(S.simT);
  if (S.data.length > 2) {
    const dT = (S.dTeq > 0 ? Math.max(...S.data.map(p => p.T)) : Math.min(...S.data.map(p => p.T))) - S.T0;
    dtVal.textContent = (dT > 0 ? "+" : "") + dT.toFixed(1);
  }
}

/* ================= 温度曲线 ================= */
const GRAPH_H = 420;            // 纵轴拉高，避免曲线被压扁
const TMAX_COL = "#d9532f";     // 最高温度标注 / ΔT 标注统一用的颜色
const DATA_COL = "#1f6fb8";     // 实测温度曲线（浅色背景下黄色会看不见，改用深蓝）
function drawGraph() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const W = Math.max(320, graph.clientWidth), H = GRAPH_H;
  const bw = Math.round(W * dpr), bh = Math.round(H * dpr);
  if (graph.width !== bw) graph.width = bw;
  if (graph.height !== bh) graph.height = bh;
  if (graph.style.height !== H + "px") graph.style.height = H + "px";
  const c = gctx;
  c.setTransform(dpr, 0, 0, dpr, 0, 0);
  c.clearRect(0, 0, W, H);
  const ML = 56, MR = 20, MT = 22, MB = 40;
  const pw = W - ML - MR, ph = H - MT - MB;

  // 坐标范围
  let tLo = S.T0, tHi = S.T0;
  for (const p of S.data) { tLo = Math.min(tLo, p.T); tHi = Math.max(tHi, p.T); }
  if (S.phase === "run" || S.phase === "done") {
    tLo = Math.min(tLo, S.T0 + Math.min(0, S.dTeq));
    tHi = Math.max(tHi, S.T0 + Math.max(0, S.dTeq));
  }
  tLo = Math.floor(tLo - 1); tHi = Math.ceil(tHi + 1);
  if (tHi - tLo < 4) tHi = tLo + 4;
  const X = t => ML + (t / RUN_TIME) * pw;
  const Y = T => MT + (1 - (T - tLo) / (tHi - tLo)) * ph;

  // 网格与坐标轴
  c.strokeStyle = "#e4eaf1"; c.fillStyle = "#6b7f94"; c.font = "11px sans-serif"; c.lineWidth = 1;
  for (let t = 0; t <= RUN_TIME; t += 30) {
    c.beginPath(); c.moveTo(X(t), MT); c.lineTo(X(t), MT + ph); c.stroke();
    c.fillText(t + "", X(t) - 4, MT + ph + 16);
  }
  for (let T = tLo; T <= tHi; T += Math.max(1, Math.round((tHi - tLo) / 8))) {
    c.beginPath(); c.moveTo(ML, Y(T)); c.lineTo(ML + pw, Y(T)); c.stroke();
    c.fillText(T.toFixed(0), ML - 24, Y(T) + 4);
  }
  c.fillText("t / s", ML + pw / 2 - 12, H - 6);
  c.save(); c.translate(14, MT + ph / 2 + 24); c.rotate(-Math.PI / 2);
  c.fillText("T / °C", 0, 0); c.restore();

  // T0 基线
  c.strokeStyle = "#9aa8b8"; c.setLineDash([5, 4]);
  c.beginPath(); c.moveTo(ML, Y(S.T0)); c.lineTo(ML + pw, Y(S.T0)); c.stroke();
  c.setLineDash([]);
  c.fillStyle = "#5d7085"; c.fillText("T₀ = " + S.T0.toFixed(1), ML + pw - 76, Y(S.T0) - 5);

  // 理想（完全绝热）参考曲线：与实际曲线之间的差 = 与环境交换的热量
  const idealOn = showIdeal.checked && S.data.length > 1 && (S.phase === "run" || S.phase === "done");
  if (idealOn) {
    const idealT = t => curveT(t, S.T0, S.dTeq, S.tau1, Infinity);
    const tEnd = Math.max(2, S.phase === "done" ? RUN_TIME : S.simT);
    const step = Math.max(0.5, tEnd / 150);
    c.beginPath();
    for (let t = 0; t <= tEnd; t += step) { const px = X(t), py = Y(idealT(t)); t ? c.lineTo(px, py) : c.moveTo(px, py); }
    for (let t = tEnd; t >= 0; t -= step) c.lineTo(X(t), Y(modelT(t)));
    c.closePath();
    c.fillStyle = S.dTeq > 0 ? "rgba(217,83,47,0.18)" : "rgba(31,127,196,0.18)";
    c.fill();
    c.strokeStyle = "#7b8ea3"; c.lineWidth = 1.6; c.setLineDash([7, 5]);
    c.beginPath();
    for (let t = 0; t <= tEnd; t += step) { const px = X(t), py = Y(idealT(t)); t ? c.lineTo(px, py) : c.moveTo(px, py); }
    c.stroke(); c.setLineDash([]);
  }

  // 数据曲线
  if (S.data.length > 1) {
    c.strokeStyle = DATA_COL; c.lineWidth = 2; c.beginPath();
    S.data.forEach((p, i) => i ? c.lineTo(X(p.t), Y(p.T)) : c.moveTo(X(p.t), Y(p.T)));
    c.stroke();
    c.fillStyle = DATA_COL;
    for (const p of S.data) if (Math.round(p.t) % 10 === 0) {
      c.beginPath(); c.arc(X(p.t), Y(p.T), 2.5, 0, Math.PI * 2); c.fill();
    }
  }

  // 完成后标注 ΔT
  if (S.phase === "done" && S.data.length) {
    const extreme = S.dTeq > 0 ? Math.max(...S.data.map(p => p.T)) : Math.min(...S.data.map(p => p.T));
    c.strokeStyle = TMAX_COL; c.setLineDash([5, 4]);
    c.beginPath(); c.moveTo(ML, Y(extreme)); c.lineTo(ML + pw, Y(extreme)); c.stroke();
    c.setLineDash([]);
    c.fillStyle = TMAX_COL;
    c.fillText("T" + (S.dTeq > 0 ? "max" : "min") + " = " + extreme.toFixed(1), ML + pw - 76, Y(extreme) + (S.dTeq > 0 ? 14 : -6));
    // 双向箭头（与最高温度标注同色）
    const ax = ML + 14;
    c.strokeStyle = TMAX_COL; c.lineWidth = 1.6;
    c.beginPath(); c.moveTo(ax, Y(S.T0)); c.lineTo(ax, Y(extreme)); c.stroke();
    const dir = S.dTeq > 0 ? 1 : -1;
    arrowHead(c, ax, Y(extreme), dir, TMAX_COL); arrowHead(c, ax, Y(S.T0), -dir, TMAX_COL);
    c.fillStyle = TMAX_COL; c.font = "bold 12px sans-serif";
    c.fillText("ΔT", ax + 6, (Y(S.T0) + Y(extreme)) / 2 + 4);
  }

  // 外推法拟合线（拓展模块，刻意画得低调，可由开关关闭）
  if (S.extrap && showExtrap.checked) {
    const ex = S.extrap;
    c.strokeStyle = "#3f9142"; c.lineWidth = 1.2; c.setLineDash([5, 4]);
    c.beginPath(); c.moveTo(X(0), Y(ex.a)); c.lineTo(X(ex.t1), Y(ex.a + ex.b * ex.t1)); c.stroke();
    c.setLineDash([]);
    c.strokeStyle = "#3f9142"; c.lineWidth = 2;
    c.beginPath(); c.arc(X(0) + 5, Y(ex.Text), 4.5, 0, Math.PI * 2); c.stroke();
    c.fillStyle = "#2c6e49"; c.font = "11px sans-serif";
    c.fillText(t("g.extrapMark") + ex.Text.toFixed(2), X(0) + 14, Y(ex.Text) - 6);
  }

  setLegend(idealOn
    ? t("g.legendIdeal", { dir: t(S.dTeq > 0 ? "g.legendLoss" : "g.legendGain") })
    : "");
}
function setLegend(html) {
  if (graphLegend.dataset.h === html) return;
  graphLegend.dataset.h = html;
  graphLegend.innerHTML = html;
  graphLegend.style.display = html ? "" : "none";
}
function arrowHead(c, x, y, dir, color) {
  c.beginPath(); c.moveTo(x, y);
  c.lineTo(x - 4, y + 7 * dir); c.lineTo(x + 4, y + 7 * dir);
  c.closePath(); c.fillStyle = color; c.fill();
}

// 点击曲线读取数据点
graph.addEventListener("click", ev => {
  if (!S.data.length) return;
  const r = graph.getBoundingClientRect();
  const t = ((ev.clientX - r.left) - 56) / (graph.clientWidth - 76) * RUN_TIME;
  let best = S.data[0];
  for (const p of S.data) if (Math.abs(p.t - t) < Math.abs(best.t - t)) best = p;
  setStatus("status.point", { t: best.t.toFixed(0), T: best.T.toFixed(2) });
});

/* ================= 误差分析模块 ================= */
// 同一个操作缺陷下，放热与吸热曲线的走向相反，但 |ΔH| 都偏小。
function flawCurves(p, fl) {
  const dir = Math.sign(p.dTeq);
  const ideal = Math.abs(peakOf(t => curveT(t, p.T0, p.dTeq, p.tau1, Infinity), dir) - p.T0);
  const std = Math.abs(peakOf(t => curveT(t, p.T0, p.dTeq, p.tau1, p.tau2), dir) - p.T0);
  const act = Math.abs(peakOf(t => curveT(t, p.T0, p.dTeq, p.tau1 * fl.tau1f, p.tau2 * fl.tau2f), dir) - p.T0);
  return { total: (act - ideal) / ideal * 100, cost: (act - std) / std * 100 };
}

function drawErrGraph(cv, p, fl) {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const W = Math.max(200, cv.clientWidth || 300);
  const H = Math.round(W * 0.62);
  if (cv.style.height !== H + "px") cv.style.height = H + "px";
  const bw = Math.round(W * dpr), bh = Math.round(H * dpr);
  if (cv.width !== bw) cv.width = bw;
  if (cv.height !== bh) cv.height = bh;
  const c = cv.getContext("2d");
  c.setTransform(dpr, 0, 0, dpr, 0, 0);
  c.clearRect(0, 0, W, H);

  const ML = 46, MR = 12, MT = 16, MB = 26;
  const pw = W - ML - MR, ph = H - MT - MB;
  const ideal = t => curveT(t, p.T0, p.dTeq, p.tau1, Infinity);          // 完全绝热
  const ctrl = t => curveT(t, p.T0, p.dTeq, p.tau1, p.tau2);             // 无缺陷对照
  const act = t => curveT(t, p.T0, p.dTeq, p.tau1 * fl.tau1f, p.tau2 * fl.tau2f);  // 实际操作
  const exo = p.dTeq > 0;
  const dir = exo ? 1 : -1;

  let lo = p.T0, hi = p.T0;
  for (let t = 0; t <= RUN_TIME; t += 1) {
    lo = Math.min(lo, ideal(t), ctrl(t), act(t));
    hi = Math.max(hi, ideal(t), ctrl(t), act(t));
  }
  const pad = Math.max(0.5, (hi - lo) * 0.16);
  lo -= pad; hi += pad;
  const X = t => ML + t / RUN_TIME * pw;
  const Y = T => MT + (1 - (T - lo) / (hi - lo)) * ph;

  // 网格
  c.strokeStyle = "#e4eaf1"; c.lineWidth = 1; c.font = "10px sans-serif";
  for (let t = 0; t <= RUN_TIME; t += 50) {
    c.beginPath(); c.moveTo(X(t), MT); c.lineTo(X(t), MT + ph); c.stroke();
    c.fillStyle = "#6b7f94"; c.fillText(t + "s", X(t) - 8, MT + ph + 15);
  }
  for (let i = 0; i <= 3; i++) {
    const T = lo + (hi - lo) * i / 3;
    c.strokeStyle = "#e4eaf1";
    c.beginPath(); c.moveTo(ML, Y(T)); c.lineTo(ML + pw, Y(T)); c.stroke();
    c.fillStyle = "#6b7f94"; c.fillText(T.toFixed(1), ML - 40, Y(T) + 3);
  }

  // T₀ 基线
  c.strokeStyle = "#9aa8b8"; c.setLineDash([4, 4]);
  c.beginPath(); c.moveTo(ML, Y(p.T0)); c.lineTo(ML + pw, Y(p.T0)); c.stroke();
  c.setLineDash([]);

  const col = exo ? "#d9532f" : "#1f7fc4";
  const rgb = exo ? "217,83,47" : "31,127,196";

  const band = (f1, f2, alpha) => {
    c.beginPath();
    for (let t = 0; t <= RUN_TIME; t += 1) { const x = X(t), y = Y(f1(t)); t ? c.lineTo(x, y) : c.moveTo(x, y); }
    for (let t = RUN_TIME; t >= 0; t -= 1) c.lineTo(X(t), Y(f2(t)));
    c.closePath();
    c.fillStyle = `rgba(${rgb},${alpha})`; c.fill();
  };
  // 浅色 = 理想↔实际（与环境交换的总热量）；深色 = 对照↔实际（本次操作额外造成的）
  // 两者透明度要拉开，否则在深色背景上分不出来是哪一层
  band(ideal, act, 0.12);
  band(ctrl, act, 0.40);

  const line = (fn, style, width, dash) => {
    c.strokeStyle = style; c.lineWidth = width; c.setLineDash(dash || []);
    c.beginPath();
    for (let t = 0; t <= RUN_TIME; t += 1) { const x = X(t), y = Y(fn(t)); t ? c.lineTo(x, y) : c.moveTo(x, y); }
    c.stroke(); c.setLineDash([]);
  };
  line(ideal, "#7b8ea3", 1.4, [6, 4]);   // 理想（完全绝热）
  line(ctrl, "#54637a", 1.6);            // 无缺陷对照
  line(act, col, 2.4);                   // 实际操作

  // 两个峰值之间的落差箭头
  const pi = peakOf(ideal, dir), pa = peakOf(act, dir);
  const ax = ML + pw - 6;
  c.strokeStyle = col; c.lineWidth = 1.8;
  c.beginPath(); c.moveTo(ax, Y(pi)); c.lineTo(ax, Y(pa)); c.stroke();
  arrowHead(c, ax, Y(pa), exo ? -1 : 1, col);
  arrowHead(c, ax, Y(pi), exo ? 1 : -1, col);
  c.fillStyle = col; c.font = "bold 10px sans-serif";
  c.fillText(t(exo ? "err.low" : "err.high"), ax - 54, (Y(pi) + Y(pa)) / 2 + 3);
}

function renderErrorPanel() {
  const fl = FLAWS[S.flaw];
  drawErrGraph(errExo, ERR_DEMO.exo, fl);
  drawErrGraph(errEndo, ERR_DEMO.endo, fl);
  if (S.flaw === "none") {
    const s = flawCurves(ERR_DEMO.exo, fl);
    errVerdict.innerHTML =
      `<div class="mech">${t("verdict.mech", { mech: t(fl.mechKey) })}</div>
       <div class="line">${t("verdict.none1", { pct: Math.abs(s.total).toFixed(1) })}</div>
       <div style="font-size:11.5px;color:#6b7f94;margin-top:7px">${t("verdict.none2")}</div>
       <div class="rule">${t("verdict.none3")}</div>`;
    return;
  }
  const sx = flawCurves(ERR_DEMO.exo, fl);
  const se = flawCurves(ERR_DEMO.endo, fl);
  errVerdict.innerHTML =
    `<div class="mech">${t("verdict.mech", { mech: t(fl.mechKey) })}</div>
     <div class="line">${t("verdict.exo", { pct: Math.abs(sx.total).toFixed(1) })}</div>
     <div class="line">${t("verdict.endo", { pct: Math.abs(se.total).toFixed(1) })}</div>
     <div style="font-size:11.5px;color:#6b7f94;margin-top:7px">${t("verdict.cost", { cost: sx.cost.toFixed(1) })}</div>
     <div class="rule">${t("verdict.rule")}</div>`;
}

function buildFlawButtons() {
  flawRow.innerHTML = "";
  for (const k of ["none", ...FLAW_ORDER]) {
    const b = document.createElement("button");
    b.className = "flaw" + (k === S.flaw ? " active" : "");
    b.textContent = t(FLAWS[k].nameKey);
    b.addEventListener("click", () => {
      S.flaw = k;
      flawRow.querySelectorAll(".flaw").forEach(x => x.classList.remove("active"));
      b.classList.add("active");
      resetSim();
      renderErrorPanel();
    });
    flawRow.appendChild(b);
  }
}

/* ================= 外推法（拓展，从属） ================= */
function resetExtrapUI(canFit) {
  S.extrap = null;
  extrapOut.innerHTML = "";
  extrapBtn.disabled = !canFit;
  showExtrap.disabled = true;
  showExtrap.checked = false;
}

function runExtrapolation() {
  if (S.data.length < 10) return;
  const pts = S.data.filter(p => p.t >= RUN_TIME * 0.6);   // 取降温段做线性拟合
  if (pts.length < 5) return;
  const n = pts.length;
  const mt = pts.reduce((a, p) => a + p.t, 0) / n;
  const mT = pts.reduce((a, p) => a + p.T, 0) / n;
  let num = 0, den = 0;
  for (const p of pts) { num += (p.t - mt) * (p.T - mT); den += (p.t - mt) ** 2; }
  const b = den ? num / den : 0;
  const a = mT - b * mt;                                   // 回推到 t = 0 的截距

  const temps = S.data.map(p => p.T);
  const Tinit = S.T0;                                      // 同 finishExperiment：用混合前记录的初温
  const Traw = S.dTeq > 0 ? Math.max(...temps) : Math.min(...temps);
  const dTraw = Traw - Tinit, dText = a - Tinit, k = S.mSol * C_WATER / (1000 * S.n);
  S.extrap = { a, b, t1: RUN_TIME, Text: a, dTraw, dText, Traw, k };
  showExtrap.disabled = false;                 // 拟合出来后才允许开关这条线
  showExtrap.checked = true;
  renderExtrapOut();
}

function renderExtrapOut() {
  const ex = S.extrap;
  if (!ex) { extrapOut.innerHTML = ""; return; }
  const sgn = v => (v > 0 ? "+" : "");
  extrapOut.innerHTML = `
    <table>
      <tr><td></td><td>T / °C</td><td>ΔT / °C</td><td>ΔH / kJ·mol⁻¹</td></tr>
      <tr><td>${t("extrap.raw")}</td><td>${ex.Traw.toFixed(2)}</td><td>${sgn(ex.dTraw)}${ex.dTraw.toFixed(2)}</td><td>${(-ex.k * ex.dTraw).toFixed(1)}</td></tr>
      <tr><td>${t("extrap.corrected")}</td><td>${ex.a.toFixed(2)}</td><td>${sgn(ex.dText)}${ex.dText.toFixed(2)}</td><td>${(-ex.k * ex.dText).toFixed(1)}</td></tr>
      <tr><td>${t("extrap.lit")}</td><td>—</td><td>—</td><td>${S.expt.dH.toFixed(1)}</td></tr>
    </table>`;
}

/* ================= 完成与计算 ================= */
function finishExperiment() {
  S.phase = "done";
  startBtn.disabled = false;
  setStatus("status.done");

  const e = S.expt, inp = S.inputs;
  const temps = S.data.map(p => p.T);
  // 初温必须取混合前记录的读数（即用户设定的 T₀）。
  // 采样是在加入试剂之后才开始的，用最初几个采样点当 T₀ 会把初温抬高约 1°C，
  // 人为放大 ΔT 的偏差。
  const Tinit = S.T0;
  const Text = S.dTeq > 0 ? Math.max(...temps) : Math.min(...temps);
  const dT = Text - Tinit;
  const q = S.mSol * C_WATER * dT;                     // J（溶液吸收，放热为正）
  const dHexp = -q / (1000 * S.n);                     // kJ/mol
  const err = (Math.abs(dHexp) - Math.abs(e.dH)) / Math.abs(e.dH) * 100;
  const ae = Math.abs(err);
  const errCls = ae < 5 ? "err-good" : ae < 15 ? "err-warn" : "err-bad";
  resetExtrapUI(true);                                  // 实验完成后才允许拟合

  S.result = { Tinit, Text, dT, q, dHexp, err, errCls };
  renderResults();
}

function renderResults() {
  const R = S.result;
  if (!R) {
    const mid = S.phase === "pour1" || S.phase === "pour2" || S.phase === "add" || S.phase === "run";
    resultsEl.innerHTML = t(mid ? "results.running" : "results.placeholder");
    return;
  }
  const e = S.expt, inp = S.inputs;
  const { Tinit, Text, dT, q, dHexp, err, errCls } = R;

  const givens = e.type === "dissolve"
    ? t("res.givens.dissolve", { solute: e.solute, mass: inp.mass, mm: e.mm, n: S.n.toFixed(4), water: inp.water, msol: S.mSol.toFixed(1) })
    : t("res.givens.neutral", {
        va: inp.va, ca: inp.ca, nH: (inp.va * inp.ca / 1000).toFixed(3),
        vb: inp.vb, cb: inp.cb, nOH: (inp.vb * inp.cb / 1000).toFixed(3),
        limiting: inp.limiting, n: S.n.toFixed(3), v: inp.va + inp.vb, msol: S.mSol.toFixed(1),
      });

  let rows = "";
  for (const p of S.data) if (Math.round(p.t) % 10 === 0)
    rows += `<tr><td>${p.t.toFixed(0)}</td><td>${p.T.toFixed(2)}</td></tr>`;

  resultsEl.innerHTML = `
    <b style="color:#16679f">${t("res.s1")}</b><br>${givens}<br>
    ${t("res.tinit", { t0: Tinit.toFixed(2), ext: t(S.dTeq > 0 ? "res.extHigh" : "res.extLow"), text: Text.toFixed(2) })}<br>
    <b>${t("res.dt", { dt: (dT > 0 ? "+" : "") + dT.toFixed(2) })}</b>${t(S.dTeq > 0 ? "res.warm" : "res.cool")}<br><br>
    <b style="color:#16679f">${t("res.s2")}</b><br>
    <span class="formula">q = m·c·ΔT = ${S.mSol.toFixed(1)} × 4.18 × ${dT.toFixed(2)}</span>
    = <b>${(q / 1000).toFixed(3)} kJ</b><br><br>
    <b style="color:#16679f">${t("res.s3")}</b><br>
    <span class="formula">ΔH = −q / n = −(${(q / 1000).toFixed(3)}) / ${S.n.toFixed(4)}</span>
    = <b>${dHexp > 0 ? "+" : ""}${dHexp.toFixed(1)} kJ/mol</b><br><br>
    <b style="color:#16679f">${t("res.s4")}</b><br>
    ${t("res.theory", { lit: (e.dH > 0 ? "+" : "") + e.dH })}
    <b class="${errCls}">${err > 0 ? "+" : ""}${err.toFixed(1)}%</b>
    <span style="color:#6b7f94">${t("res.measured", { dir: t(err < 0 ? "res.low" : "res.high") })}</span><br>
    <span style="color:#6b7f94;font-size:12px">${t("res.cond", { flaw: t(FLAWS[S.flaw].nameKey) })}</span>
    <table><tr><th>t / s</th><th>T / °C</th></tr>${rows}</table>`;
}

/* ================= 主循环 ================= */
let lastNow = performance.now();
function loop(now) {
  const dt = Math.min((now - lastNow) / 1000, 0.05);
  lastNow = now;
  tick(dt);
  drawLab(now);
  updateReadout();
  drawGraph();
  requestAnimationFrame(loop);
}

/* ================= 语言切换 ================= */
function applyStaticI18n() {
  document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll("[data-i18n-html]").forEach(el => { el.innerHTML = t(el.dataset.i18nHtml); });
  document.title = t("title");
  document.documentElement.lang = LANG === "zh" ? "zh-CN" : "en";
  langSw.querySelectorAll("button").forEach(b => b.classList.toggle("active", b.dataset.lang === LANG));
}

// 切换语言时凡是含文案的部分都要重建（下拉项、输入标签、缺陷按钮、结果、状态栏）
function setLang(lang) {
  if (!I18N[lang] || lang === LANG) return;
  LANG = lang;
  try { localStorage.setItem("calorimetry-lang", lang); } catch (e) {}
  applyStaticI18n();
  buildExptSelect();
  renderInputs();
  buildFlawButtons();
  renderErrorPanel();
  renderExtrapOut();
  renderResults();
  statusEl.textContent = t(statusKey, statusParams);
}

langSw.addEventListener("click", e => {
  const b = e.target.closest("button[data-lang]");
  if (b) setLang(b.dataset.lang);
});

extrapBtn.addEventListener("click", runExtrapolation);
window.addEventListener("resize", renderErrorPanel);

applyStaticI18n();
buildExptSelect();
renderInputs();
resetSim();
buildFlawButtons();
renderErrorPanel();
requestAnimationFrame(loop);
</script>
